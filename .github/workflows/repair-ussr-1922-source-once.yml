name: Apply staged 1922 source correction
on:
  push:
    branches: [work/active]
    paths:
      - '.github/workflows/repair-ussr-1922-source-once.yml'
permissions:
  contents: write
concurrency:
  group: repair-ussr-1922-source-once
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'kimjeon-il/PandoLab-Data' && github.event.head_commit.message == 'stage 1922 Iran-Caspian source correction for atomic indexing'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          sparse-checkout: |
            /archive/index.json
            /.github/workflows/repair-ussr-1922-source-once.yml
            /reports/borders/validation/ussr-1922-iran-caspian-source-correction-2026-11-24.json
          sparse-checkout-cone-mode: false
          persist-credentials: true
      - name: Verify exact original and replacement bytes, then index only selected sources
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {execFileSync as git} from 'node:child_process';
          import {createHash} from 'node:crypto';
          import {gunzipSync} from 'node:zlib';
          import assert from 'node:assert/strict';
          const root="assets/data/territorial-entities/";
          const rows=[{"n":"state-soviet-union","od":"fdcd0710e54cc369ba9d09a1bf3b6f7ca539972f8d6a3007f42a0c0c44690fc4","d":"1a64232514ea9aae5e832a41dd7dcd9237741bf78575452c3ea5d62cb3b35c56","db":144555,"og":"dea1fa768510a3475abb90da80aa929cb9cb92815ae2b6e19b964425199d2544","g":"10177940ffa7bac8c48a992a5c284359607cfa599500b1a8388b04d19538677e","gb":1617751},{"n":"state-soviet-union-russian-sfsr","od":"97914c99b673e6312f100b395ffe2257f8cfcb1d94a5dda1d821dd51b9702ff8","d":"94ba3e06a1822dd0427bfd0c2d204147257135f52382c7cd1a115c97475812cb","db":123667,"og":"72a7dba92731bfe0030ecc867e6ba6c8ec32377a70a75ce62589c00803772671","g":"7e38bb3e5a7d8cefa66dd85f8d36407b34c297b872c98408c4a7f9b1a5c11549","gb":1590737},{"n":"state-IRN","od":"b732efa94b164e83d17f88b7dd47de36655ddd70ad987d05469735cbca2c96aa","d":"e20fe5a5bd23bbd0c57cbcd0745ee28c946a8ad2f5932227e5d4651c25bc4664","db":72329,"og":"f46d52834f5d1c710dcd84b69333a97544180e2a37bbee1844400eb79855ef1e","g":"8370eb71e63e4cd7dc581ff52435517f70b14be1160f6a1cadae67f9a3a6e27d","gb":283996},{"n":"state-soviet-union-transcaucasian-sfsr","od":"ece8286a66d0f99d12ed75e6677b798a265607e02a0cf63aa699405db1c9300a","d":"863cbe659d61821556440b1cc0f48b3775a0662ef6d5d768e8bb0b3f18b54a4e","db":9271,"og":"eddfe1fb8c63417a196b8a50ad9c9992cc013f742d872fc505521bf90bd0e0ca","g":"85caadf3b56c3bd3707f257e1f3ac59f94652b92b3974bc2eea490a6f065e947","gb":69290}];
          const base="acf962d7ed6924c1602ada0ebdc441f6f805a444",proof="reports/borders/validation/ussr-1922-iran-caspian-source-correction-2026-11-24.json",proofHash="b999a2ca630e45c4f9d90322fef4b00cc45d5ba491b4e8d0d63ca1fc2ca4fac1";
          const sha=b=>createHash('sha256').update(b).digest('hex');
          const get=(p)=>git('git',['show','HEAD:'+p],{maxBuffer:40*1024*1024});
          const oldAndNew=(h,n)=>{
            const path=root+'.originals/'+h+'.gz';
            const b=gunzipSync(get(path));
            assert.equal(sha(b),h,path);
            if(n!==undefined)assert.equal(b.length,n,path);
            return {b,json:JSON.parse(b),path};
          };
          assert.equal(git('git',['rev-parse','HEAD^'],{encoding:'utf8'}).trim(),base);
          const original=JSON.parse(fs.readFileSync('archive/index.json','utf8'));
          const a=structuredClone(original);
          const expected=new Set();
          for(const r of rows){
            const dp=root+'source/countries/'+r.n+'.json';
            const oldgp=root+'source/geometries/sha256-'+r.og+'.json';
            const gp=root+'source/geometries/sha256-'+r.g+'.json';
            assert.equal(a.files[dp]?.sha256,r.od);
            assert.equal(a.files[oldgp]?.sha256,r.og);
            assert.ok(!a.files[gp]);
            const oldD=oldAndNew(r.od),newD=oldAndNew(r.d,r.db);
            const oldG=oldAndNew(r.og),newG=oldAndNew(r.g,r.gb);
            assert.equal(newD.json.entityId,oldD.json.entityId);
            assert.equal(newG.json.type,'MultiPolygon');
            assert.equal(newD.json.geometryVersions.length,oldD.json.geometryVersions.length);
            const matches=newD.json.geometryVersions.filter(v=>v.validFrom==='1922-12-30'&&v.validTo==='1925-05-12');
            assert.equal(matches.length,1);
            assert.equal(matches[0].geometryResource.sha256,r.g);
            assert.equal(matches[0].geometryResource.bytes,r.gb);
            assert.equal(matches[0].geometryResource.file,'geometries/sha256-'+r.g+'.json');
            for(const v of oldD.json.geometryVersions.filter(v=>v.versionId!==matches[0].versionId))
              assert.deepEqual(newD.json.geometryVersions.find(x=>x.versionId===v.versionId),v);
            assert.equal(newD.json.geometryVersions.find(v=>v.versionId===matches[0].versionId).historicalProvenance.displayDetailReview.status,'provisional');
            a.files[dp]={stored:newD.path,encoding:'gzip',sha256:r.d,bytes:r.db};
            a.files[gp]={stored:newG.path,encoding:'gzip',sha256:r.g,bytes:r.gb};
            expected.add(dp);expected.add(gp);
            console.log('Verified '+r.n+' descriptor and geometry');
          }
          const p=get(proof);
          assert.equal(sha(p),proofHash);
          assert.equal(p.length,8830);
          assert.ok(!a.files[proof]);
          a.files[proof]={stored:proof,encoding:'identity',sha256:proofHash,bytes:p.length};
          expected.add(proof);
          const changed=Object.keys(a.files).filter(k=>JSON.stringify(a.files[k])!==JSON.stringify(original.files[k]));
          assert.deepEqual([...changed].sort(),[...expected].sort());
          assert.equal(Object.keys(a.files).length,Object.keys(original.files).length+5);
          fs.writeFileSync('archive/index.json',JSON.stringify(a,null,2)+'\n');
          console.log('Verified exactly '+changed.length+' archive entries; generated runtime is unchanged.');
          NODE
      - name: Publish verified archive index with a fast-forward check
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/work/active | cut -f1)" = "$GITHUB_SHA"
          git add -- archive/index.json
          test "$(git diff --cached --name-only)" = archive/index.json
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data(history): apply 1922 Soviet-Iran and Ogurja Ada source correction'
          git push origin HEAD:refs/heads/work/active
          test "$(git ls-remote origin refs/heads/work/active | cut -f1)" = "$(git rev-parse HEAD)"
